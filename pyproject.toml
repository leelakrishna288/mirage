[project]
name = "mirage"
version = "0.1.0"
description = "Evidence-sensitivity testing for RAG systems — mutate the evidence, measure whether the answer notices."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional. mirage's hard dependencies stay numpy + scikit-learn so the tool
# runs offline with no extras; this only adds the alternative pipeline adapter.
langgraph = ["langgraph>=0.2"]

[project.scripts]
mirage = "mirage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
